<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2A332C"/>
      <stop offset="50%" stop-color="#171C18"/>
      <stop offset="100%" stop-color="#0B0D0C"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="terraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C77D57" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#C77D57" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CC28A"/>
      <stop offset="55%" stop-color="#3F8A5C"/>
      <stop offset="100%" stop-color="#22533A"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A6A4E"/>
      <stop offset="100%" stop-color="#4E3A2A"/>
    </linearGradient>
    <radialGradient id="eyeball" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFBEE"/>
      <stop offset="100%" stop-color="#D8C3A5"/>
    </radialGradient>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- Fondo con dos luces de color: el camaleón cambia de tono con la música -->
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="300" cy="360" r="340" fill="url(#cyanGlow)"/>
  <circle cx="730" cy="640" r="320" fill="url(#terraGlow)"/>

  <!-- Sombra en el suelo -->
  <ellipse cx="500" cy="868" rx="290" ry="26" fill="url(#shadowG)"/>

  <!-- Rama -->
  <rect x="120" y="770" width="760" height="64" rx="32" fill="url(#branch)"/>
  <rect x="150" y="780" width="700" height="10" rx="5" fill="#B89474" opacity="0.5"/>

  <!-- Cola enrollada -->
  <path d="M690 735 C 800 775 835 690 792 652 C 762 626 738 662 768 678" fill="none" stroke="#3F8A5C" stroke-width="42" stroke-linecap="round"/>
  <path d="M700 735 C 800 770 830 695 792 658" fill="none" stroke="#7CC28A" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>

  <!-- Cuerpo -->
  <ellipse cx="500" cy="690" rx="215" ry="150" fill="url(#skin)"/>
  <ellipse cx="385" cy="660" rx="26" ry="70" transform="rotate(15 385 660)" fill="#FFFFFF" opacity="0.15"/>

  <!-- Patrón de escamas en forma de píxeles redondeados -->
  <g fill="#B8E08A" opacity="0.5">
    <rect x="310" y="630" width="16" height="16" rx="4"/>
    <rect x="342" y="654" width="16" height="16" rx="4"/>
    <rect x="316" y="682" width="16" height="16" rx="4"/>
    <rect x="672" y="630" width="16" height="16" rx="4"/>
    <rect x="640" y="654" width="16" height="16" rx="4"/>
    <rect x="666" y="682" width="16" height="16" rx="4"/>
    <rect x="492" y="716" width="16" height="16" rx="4"/>
    <rect x="462" y="742" width="16" height="16" rx="4"/>
    <rect x="522" y="742" width="16" height="16" rx="4"/>
  </g>

  <!-- Cabeza -->
  <path d="M265 430 C 265 290 370 230 500 230 C 630 230 735 290 735 430 C 735 540 640 600 500 600 C 360 600 265 540 265 430 Z" fill="url(#skin)"/>

  <!-- Crestas dorsales -->
  <circle cx="395" cy="262" r="20" fill="#5FA26F"/>
  <circle cx="500" cy="240" r="24" fill="#5FA26F"/>
  <circle cx="605" cy="262" r="20" fill="#5FA26F"/>

  <!-- Brillo de la cabeza -->
  <ellipse cx="370" cy="290" rx="70" ry="22" transform="rotate(-18 370 290)" fill="#FFFFFF" opacity="0.22"/>

  <!-- Ojos turret: cada uno mira hacia un lado distinto -->
  <circle cx="380" cy="400" r="108" fill="#173D29"/>
  <circle cx="620" cy="400" r="108" fill="#173D29"/>
  <circle cx="380" cy="400" r="90" fill="url(#eyeball)"/>
  <circle cx="620" cy="400" r="90" fill="url(#eyeball)"/>
  <circle cx="400" cy="410" r="42" fill="#1A2A20"/>
  <circle cx="615" cy="385" r="42" fill="#1A2A20"/>
  <circle cx="414" cy="396" r="12" fill="#FFFFFF"/>
  <circle cx="630" cy="371" r="12" fill="#FFFFFF"/>

  <!-- Sonrisa y mejillas -->
  <path d="M415 555 Q500 615 585 555" fill="none" stroke="#173D29" stroke-width="14" stroke-linecap="round"/>
  <circle cx="302" cy="520" r="30" fill="#C77D57" opacity="0.35"/>
  <circle cx="698" cy="520" r="30" fill="#C77D57" opacity="0.35"/>

  <!-- Pies con agarre sobre la rama -->
  <circle cx="318" cy="800" r="34" fill="#2F6B47"/>
  <circle cx="352" cy="812" r="26" fill="#2F6B47"/>
  <circle cx="682" cy="800" r="34" fill="#2F6B47"/>
  <circle cx="648" cy="812" r="26" fill="#2F6B47"/>

  <!-- Viñeta -->
  <rect width="1000" height="1000" fill="url(#vignette)"/>
</svg>
